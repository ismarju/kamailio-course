# ISMAR - Ovdje us smještene request route

/* Main SIP request routing logic
 * - processing of any incoming SIP request starts with this route
 * - note: this is the same as route { ... } */
request_route {

	# ISMAR - pravimo provjeru korištenjem pike modula	
	# pike_check_req will return True / 1 if a source IP is allowed
	# if not, exit as the source is thought to be flooding traffic.
	if (!pike_check_req()) { 
		xlog("L_INFO", "PIKE MODUL | ODBIJA PORUKE !!!!!!!\n");
		exit; 
	}

	# ISMAR - htable module provjera
	# Check the htable blacklist, and secfilter db 
	route(BLACKLIST);
	
	# per request initial checks
	route(REQINIT);

	# ISMAR - Dodavanje custom X headera
	route(SET_CUSTOM_X_HEADER);

	# ISMAR - Setovanje direction flag-a
	route(SET_DIRECTION_FLAG);

	# ISMAR - setovanje socket-a. Ovisno o DIRECTION_FLAG-u će se odabrati socket za slanje INVITE-a
	# Ako je poziv iz CORE-a onda se koristi core socket, inače se koristi public socket
	route(SET_SOCKET); 

	# ISMAR - modifikaija From headera
	# Ovo smo zakomentirali jer je u ovom trenutku nepotrebno
	# $fu = "sip:modificiran@" + "localhost:" + $sp;

	# CANCEL processing
	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	# handle retransmissions
	if (!is_method("ACK")) {
		if(t_precheck_trans()) {
			t_check_trans();
			exit;
		}
		t_check_trans();
	}

	# ISMAR - Handle REGISTER Requests
	route(HANDLE_REGISTER);

	# ISMAR - dodajemo za manipulaciju SDP kodeka
	route(REMOVE_CODECS_INBOUND);

	# ISMAR - managiranje RTP-a ("povlačimo" RTP kroz RTP engine)
	route(SET_RTP_REQUEST);

	# handle requests within SIP dialogs
	route(WITHINDLG);

	### only initial requests (no To tag)

	# record routing for dialog forming requests (in case they are routed)
	# - remove preloaded route headers
	remove_hf("Route");
	if (is_method("INVITE|SUBSCRIBE")) {
		record_route();
	}

	# account only INVITEs
	if (is_method("INVITE")) {
		route(SET_CDR_VARS); # ISMAR - idemo na rutu u kojoj se setuju dodatni CDR parametri
		setflag(FLT_DLG); # ISMAR - ovaj flag koristimo da aktiviramo zapisivanje CDR zapisa u acc_cdrs tabelu	
		setflag(FLT_ACC); # do accounting
	}

	if ($rU==$null) {
		# request with no Username in RURI
		sl_send_reply("484", "Address Incomplete");
		exit;
	}

	# ISMAR - rutiranje po lokaciji korisnika
	if(method=="INVITE"){
		# Check for registrations first
		if(!lookup("location")){
			xlog("L_INFO", "$tU is not registered. Quiting. \n");
			sl_send_reply("404", "Destination is not found"); 
			exit; 
		} 	
	}

	# update $du to set the destination address for proxying
	# $du = "sip:" + $rd + ":9";
	route(RELAY);
	exit;
}